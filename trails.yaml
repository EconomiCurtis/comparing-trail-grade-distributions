  gr10:
    name: Pyrenean Way (GR10)
    region: Europe
    long_name: Pyrenean Way (GR10)
    osm_relation: [7411271, 7411270, 7411269, 7411268, 7411267, 7411266, 7411265, 7411264, 548457]   # its 9 sections (no parent route)
    official_km: 866           # about 866 km
    start: [-1.762, 43.372]    # Hendaye, Atlantic; eastbound
    direction: Eastbound
    end: [3.130, 42.483]       # Banyuls-sur-Mer, Mediterranean
  gr11:
    name: Senda Pirenaica (GR11)
    region: Europe
    long_name: Senda Pirenaica (GR11)
    osm_relation: [8865914, 10605305]   # the superroute, plus stage E36 (Elizondo - Bera), which it leaves out
    official_km: 840           # about 840 km
    start: [-1.794, 43.393]    # Cabo Higuer, Hondarribia, Atlantic; eastbound
    direction: Eastbound
    end: [3.322, 42.319]       # Cap de Creus, Mediterranean

  gr20:
    name: Fra li Monti (GR20)
    region: Europe
    long_name: Fra li Monti (GR20), Corsica
    osm_relation: 12484370     # GR 20 Principale, the main route (the superroute 101692 also holds the variants)
    official_km: 180           # about 180 km (FFRandonnée)
