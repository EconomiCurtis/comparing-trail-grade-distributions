# Trails and settings for the grade comparison. Every trail goes through exactly the same steps
# (scripts/build_grades.py). To add a trail: add an entry, then `make download grades TRAILS=<key>`.
#
# Per trail:
#   name           short label for plots and tables
#   long_name      full name for the text
#   region         for grouping in the table
#   track_file     instead of osm_relation: your own GPX or GeoJSON track, path from the repo root
#   osm_relation   OpenStreetMap route relation id (a parent "superroute" of section relations is fine), or a
#                  list of them for a trail split across several
#                  Find one at https://hiking.waymarkedtrails.org or https://www.openstreetmap.org.
#   official_km    published length, used only to check the mapped track's length (null: none published)
#   direction      the usual hiking direction, as a label (NoBo, SoBo, Westbound, Clockwise...)
#   start          [lon, lat] where hikers usually begin. Grades are signed in that direction: uphill positive.
#   end            [lon, lat] where they usually finish (optional; helps put a trail's pieces in order)
#   skip_relations section relations to leave out (alternates mapped as main route)
#   loop           for a loop trail, the usual direction: clockwise or counterclockwise (start is then any point on it)

trails:
  pct:
    name: PCT
    region: Americas
    long_name: Pacific Crest Trail
    osm_relation: 1225378
    official_km: 4265          # 2,650 mi (PCTA)
    start: [-116.467, 32.590]  # Campo, Mexican border; northbound
    direction: NoBo
    end: [-120.800, 49.000]  # Canadian border, Manning Park
  at:
    name: AT
    region: Americas
    long_name: Appalachian Trail
    osm_relation: 156553
    official_km: 3536          # 2,197 mi (ATC)
    start: [-84.194, 34.627]   # Springer Mountain; northbound
    direction: NoBo
    end: [-68.921, 45.904]   # Katahdin
  cdt:
    name: CDT
    region: Americas
    long_name: Continental Divide Trail
    osm_relation: 921198
    official_km: 4989          # 3,100 mi
    start: [-108.206, 31.498]  # Crazy Cook, Mexican border; northbound
    direction: NoBo
    end: [-113.910, 49.000]  # Canadian border, Waterton Lake
  gdt:
    name: GDT
    region: Americas
    long_name: Great Divide Trail
    osm_relation: 8139599      # superroute of sections A-G
    official_km: 1130          # about 1,130 km (Great Divide Trail Association)
    start: [-113.914, 49.000]  # Waterton, US border; northbound
    direction: NoBo
    end: [-120.184, 54.010]    # Kakwa Lake

  annapurna:
    name: Annapurna Circuit
    region: Nepal
    long_name: Annapurna Circuit
    osm_relation: 1187310
    official_km: null          # treks vary; the mapped route is Besisahar - Thorong La - Jomsom - Ghorepani - Birethanti
    start: [84.380, 28.230]    # Besisahar; counterclockwise around the Annapurnas, over Thorong La
    direction: Counter-Clockwise
    end: [83.789, 28.300]    # Birethanti
  jmt:
    name: JMT
    region: Americas
    long_name: John Muir Trail
    osm_relation: 1244828
    official_km: 340           # 211 mi
    start: [-119.558, 37.732]  # Happy Isles, Yosemite Valley; southbound to Mount Whitney
    direction: SoBo
    end: [-118.292, 36.579]  # Mount Whitney
  ct:
    name: Colorado Trail
    region: Americas
    long_name: Colorado Trail
    osm_relation: 3445384      # Collegiate East (Collegiate West is an alternative and is left out)
    official_km: 782           # 486 mi (Colorado Trail Foundation, Collegiate East)
    start: [-105.094, 39.490]  # Waterton Canyon, Denver; to Durango
    direction: SoBo
    end: [-107.905, 37.336]  # Junction Creek, Durango
  azt:
    name: AZT
    region: Americas
    long_name: Arizona Trail
    osm_relation: 2804113
    official_km: 1287          # 800 mi (Arizona Trail Association)
    start: [-110.251, 31.333]  # Coronado National Memorial, Mexican border; northbound
    direction: NoBo
    end: [-112.040, 37.000]  # Utah border
  pnt:
    name: PNT
    region: Americas
    long_name: Pacific Northwest Trail
    osm_relation: 11225405
    official_km: 1931          # 1,200 mi (Pacific Northwest Trail Association)
    start: [-113.660, 48.996]  # Chief Mountain, Glacier National Park; westbound to the Pacific
    direction: Westbound
    end: [-124.733, 48.165]  # Cape Alava, Pacific coast
  wonderland:
    name: Wonderland Trail
    region: Americas
    long_name: Wonderland Trail
    osm_relation: 4111743
    official_km: 150           # 93 mi (National Park Service)
    start: [-121.811, 46.750]  # Longmire
    direction: Clockwise
    loop: clockwise
  trt:
    name: Tahoe Rim Trail
    region: Americas
    long_name: Tahoe Rim Trail
    osm_relation: 3094865
    official_km: 266           # 165 mi (Tahoe Rim Trail Association)
    start: [-120.146, 39.166]  # Tahoe City
    direction: Clockwise
    loop: clockwise
  tmb:
    name: Tour du Mont Blanc
    region: Europe
    long_name: Tour du Mont Blanc
    osm_relation: 124456       # the main loop; its variants are alternatives and are left out
    official_km: 165           # about 165-170 km, depending on variants
    start: [6.800, 45.890]     # Les Houches
    direction: Counter-Clockwise
    loop: counterclockwise
  via_alpina_red:
    name: Via Alpina Red
    region: Europe
    long_name: Via Alpina Red Trail
